name: Validate EOA3 translations
on:
  push:
    paths:
      - 'translations/**'
      - 'source/**'
      - 'tools/**'
      - '.github/workflows/validate-translations.yml'
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original hashes, script schema and control codes
        run: python tools/scripts.py check
      - name: Unit tests
        run: python tools/test_scripts.py
      - name: Validate display-name drafts without touching lookup keys
        run: python tools/audit_names.py check
      - name: Static name reference unit tests
        run: python tools/test_name_audit.py
      - name: Synthetic Windows executable preflight tests (no copyrighted binary)
        run: python tools/test_probe_game.py
      - name: Check Unicode translation structure and line-width heuristics
        run: python tools/audit_unicode_layout.py check
      - name: Test Unicode and line-width analyzer
        run: python tools/test_audit_unicode_layout.py
      - name: Test optional Windows GDI font probe via mocks
        run: python tools/test_windows_font_probe.py
      - name: Test consolidated diagnostic ZIP on synthetic EXE
        run: python tools/test_windows_diagnostic_bundle.py
      - name: Test safe portable Windows tool packaging
        run: python tools/test_package_diagnostics.py
      - name: Package portable Windows diagnostics (no game files)
        run: python tools/package_diagnostics.py --out build/EOA3-Windows-Diagnostic-Tool.zip
      - uses: actions/upload-artifact@v4
        with:
          name: eoa3-windows-oneclick-diagnostic-tool
          path: build/EOA3-Windows-Diagnostic-Tool.zip
      - name: Generate font and line-wrap QA report
        run: python tools/audit_unicode_layout.py report --out build/unicode_layout_report.json
      - name: Export potential string references
        run: python tools/audit_names.py report --out build/name_reference_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: eoa3-name-reference-report
          path: build/name_reference_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: eoa3-unicode-font-layout-audit
          path: build/unicode_layout_report.json

  windows-oneclick-smoke:
    name: Windows one-click report smoke
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run CMD launcher with a synthetic EXE on real Windows
        shell: pwsh
        env:
          EOA3_NO_OPEN: "1"
        run: |
          New-Item -ItemType Directory -Force build\fakegame | Out-Null
          python -c "import sys;sys.path.insert(0,'tools');from test_probe_game import fake_pe32;from pathlib import Path;Path('build/fakegame/AngelSLG.exe').write_bytes(fake_pe32())"
          & cmd.exe /d /c 'EOA3-KiemTra-Windows.cmd build\fakegame\AngelSLG.exe'
          if ($LASTEXITCODE -ne 0) { throw "Launcher returned exit code $LASTEXITCODE" }
          if (-not (Test-Path 'build\EOA3-Windows-Diagnostics.zip')) {
            if (Test-Path 'build\EOA3-Diagnostic-Log.txt') { Get-Content 'build\EOA3-Diagnostic-Log.txt' }
            throw 'One-click launcher did not create report ZIP'
          }
      - name: Verify actual Windows ZIP and manifest
        shell: pwsh
        run: |
          python -c "import json,zipfile;z=zipfile.ZipFile('build/EOA3-Windows-Diagnostics.zip');m=json.loads(z.read('manifest.json'));assert m['status']=='diagnostic_bundle_not_a_patch';assert m['translation_count']==1881;assert m['review_count']==574;assert len(z.namelist())==5;print('Windows smoke PASS:',m['font_status'])"
