name: Validate EOA3 translations
on:
  push:
    paths:
      - 'translations/**'
      - 'source/**'
      - 'tools/**'
      - '.github/workflows/validate-translations.yml'
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original hashes, script schema and control codes
        run: python tools/scripts.py check
      - name: Unit tests
        run: python tools/test_scripts.py
      - name: Validate display-name drafts without touching lookup keys
        run: python tools/audit_names.py check
      - name: Static name reference unit tests
        run: python tools/test_name_audit.py
      - name: Synthetic Windows executable preflight tests (no copyrighted binary)
        run: python tools/test_probe_game.py
      - name: Check Unicode translation structure and line-width heuristics
        run: python tools/audit_unicode_layout.py check
      - name: Test Unicode and line-width analyzer
        run: python tools/test_audit_unicode_layout.py
      - name: Test optional Windows GDI font probe via mocks
        run: python tools/test_windows_font_probe.py
      - name: Test x86 GDI/encoding code-window collector
        run: python tools/test_probe_engine_calls.py
      - name: Verify exact TextOutA stack args without modifying EXE
        run: python tools/test_inspect_textout_args.py
      - name: Verify V5 byte-strlen evidence guard using synthetic x86 signatures
        run: python tools/test_verify_v5_strlen.py
      - name: Verify V5 ANSI CharNextA percent loop and TextOutA overlapping snapshots
        run: python tools/test_audit_v5_text_iteration.py
      - name: Verify DirectDraw-compatible HDC lifecycle and font helpers from V5
        run: python tools/test_audit_v5_surface_pipeline.py
      - name: Test read-only x86 direct-call candidate scanner and IAT labels
        run: python tools/test_probe_text_callers.py
      - name: Test targeted font helper and ANGELSCRIPT caller preflight
        run: python tools/test_probe_engine_followup.py
      - name: Test consolidated V8 renderer consumer, font helpers and reference triples with synthetic PE
        run: python tools/test_probe_renderer_v8.py
      - name: Verify real V8 sample evidence schema with synthetic x86 only
        run: python tools/test_audit_v8_renderer_trace.py
      - name: Verify observed V7 font helper byte/slot layout on synthetic x86 windows
        run: python tools/test_audit_v7_font_buffers.py
      - name: Verify V7 ANSI substring and 0x41C790 consumer handoff
        run: python tools/test_audit_v7_text_handoff.py
      - name: Verify V7 numeric palette branch without assuming control token semantics
        run: python tools/test_audit_v7_palette_commands.py
      - name: Count original EOA3 source command codes independently of text engine
        run: python tools/audit_v7_palette_commands.py --source-only --out build/source-control-codes.json
      - uses: actions/upload-artifact@v4
        with:
          name: eoa3-original-source-control-code-counts
          path: build/source-control-codes.json
      - name: Test consolidated diagnostic ZIP on synthetic EXE
        run: python tools/test_windows_diagnostic_bundle.py
      - name: Verify diagnostic ZIP reader and evidence report tests
        run: python tools/test_analyze_windows_report.py
      - name: Test safe portable Windows tool packaging
        run: python tools/test_package_diagnostics.py
      - name: Package portable Windows diagnostics (no game files)
        run: python tools/package_diagnostics.py --out build/EOA3-Windows-Diagnostic-Tool.zip
      - uses: actions/upload-artifact@v4
        with:
          name: eoa3-windows-oneclick-diagnostic-tool
          path: build/EOA3-Windows-Diagnostic-Tool.zip
      - name: Generate font and line-wrap QA report
        run: python tools/audit_unicode_layout.py report --out build/unicode_layout_report.json
      - name: Export potential string references
        run: python tools/audit_names.py report --out build/name_reference_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: eoa3-name-reference-report
          path: build/name_reference_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: eoa3-unicode-font-layout-audit
          path: build/unicode_layout_report.json

  windows-oneclick-smoke:
    name: Windows one-click report smoke
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run CMD launcher with a synthetic EXE on real Windows
        shell: pwsh
        env:
          EOA3_NO_OPEN: "1"
        run: |
          New-Item -ItemType Directory -Force build\fakegame | Out-Null
          python -c "import sys;sys.path.insert(0,'tools');from test_probe_game import fake_pe32;from pathlib import Path;Path('build/fakegame/AngelSLG.exe').write_bytes(fake_pe32())"
          & cmd.exe /d /c 'EOA3-KiemTra-Windows.cmd build\fakegame\AngelSLG.exe'
          if ($LASTEXITCODE -ne 0) { throw "Launcher returned exit code $LASTEXITCODE" }
          if (-not (Test-Path 'build\EOA3-Windows-Diagnostics.zip')) {
            if (Test-Path 'build\EOA3-Diagnostic-Log.txt') { Get-Content 'build\EOA3-Diagnostic-Log.txt' }
            throw 'One-click launcher did not create report ZIP'
          }
      - name: Verify actual Windows ZIP and manifest
        shell: pwsh
        run: |
          python -c "import json,zipfile;z=zipfile.ZipFile('build/EOA3-Windows-Diagnostics.zip');m=json.loads(z.read('manifest.json'));assert m['status']=='diagnostic_bundle_not_a_patch';assert m['translation_count']==1881;assert m['review_count']==574;assert len(z.namelist())==8;code=json.loads(z.read('engine_callsite_slices.json'));f=json.loads(z.read('engine_followup_evidence.json'));v8=json.loads(z.read('renderer_trace_v8.json'));assert code['status']=='read_only_code_neighborhoods_not_disassembly_or_patch';assert f['status']=='bounded_helper_caller_evidence_not_a_patch';assert v8['status']=='read_only_v8_renderer_trace_code_fragments_not_disassembly_or_patch';print('Windows smoke PASS:',m['font_status'])"
