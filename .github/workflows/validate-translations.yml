name: Validate EOA3 translations
on:
  push:
    paths:
      - 'translations/**'
      - 'source/**'
      - 'tools/**'
      - '.github/workflows/validate-translations.yml'
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original hashes, script schema and control codes
        run: python tools/scripts.py check
      - name: Unit tests
        run: python tools/test_scripts.py
